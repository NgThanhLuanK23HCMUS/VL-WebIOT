<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Bot</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
    crossorigin="anonymous"
    />
    <style>
        body{
            background-color: rgb(38, 37, 37);
        }

        .container{
            display: flex;
        }
        
        .right,.left{
            width: 20%;
        }

        .functionality{
            width: 60%;
        }

        .chat{
            height: 622px;
        }

        .prompt{
            height: 110px;
            border-radius: 50px;
            background-color: rgb(75, 73, 73);
        }

        .prompt input{
            background: transparent;
            color: white; 
            border: none;
            margin-top: 40px;
            margin-left: 40px;
            margin-right: 40px;
            width: 100%;
        }

        .prompt input:focus{
            outline: none;
        }

        .submit_prompt{
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

    </style>
</head>
<body>
    
    <div class="container">
        <div class="left"></div>

        <div class="functionality">
            <div class="chat">
    
            </div>
    
            <div class="prompt">
                <input type="text" placeholder="Ask anything">
                <button class="submit_prompt"></button>
            </div>
        </div>
        

        <div class="right"></div>
    </div>
    

    <script
      
    ></script>
  </body>
</html>
