<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-image: url("{{ url_for('static', filename='img/house_and_flower.jpg') }}");

        background-size: cover;
        background-repeat: no-repeat;
      }
      .custom-navbar {
        background-color: transparent !important;
        position: absolute;
        top: 20px;
        right: 20px;
        left: auto;
      }
      .custom-navbar .navbar-brand,
      .custom-navbar .nav-link {
        color: white !important;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary custom-navbar">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="{{ url_for('home') }}"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('monitor') }}">Monitor</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('control') }}"
                >Control Panel</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('analytics') }}"
                >Analytics</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('login') }}">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div
      class="d-flex flex-column justify-content-center align-items-center text-white text-center"
      style="
        height: 100vh;
        background-image: url('your-image.jpg');
        background-size: cover;
        background-position: center;
      "
    >
      <h1 class="fw-bold display-4">Welcome to Analytics</h1>
      <p class="lead fw-bold">
        Empowering you to care for your plants with smart technology
      </p>
    </div>
    <div class="container bg-light p-4 rounded shadow" style="max-width: 800px;">
    <h2 class="mb-4">Biểu đồ nhiệt độ</h2>
    <canvas id="myChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    fetch("/getDataThingSpeak")  
        .then(response => response.json())
        .then(chartData => {
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        {
                            label: 'Độ ẩm đất (%)',
                            data: chartData.soil_moisture,
                            borderColor: 'rgb(75, 192, 192)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            tension: 0.1
                        },
                        {
                            label: 'Nhiệt độ (°C)',
                            data: chartData.temperature,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            tension: 0.1
                        },
                        {
                            label: 'Độ ẩm không khí (%)',
                            data: chartData.humidity_air,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    stacked: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Biểu đồ cảm biến từ ThingSpeak'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        });
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
