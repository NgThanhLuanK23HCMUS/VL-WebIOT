<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bánh răng + Menu + Form nhập dữ liệu</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      /* Bánh răng */
      .gear-icon {
        position: fixed;
        top: 20px;
        right: 20px;
        font-size: 28px;
        cursor: pointer;
        user-select: none;
      }

      /* Popup menu */
      #gearMenu {
        display: none;
        position: fixed;
        top: 55px;
        right: 20px;
        background: white;
        border: 1px solid #ccc;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        width: 160px;
        z-index: 1100;
      }
      #gearMenu button {
        width: 100%;
        padding: 10px 15px;
        border: none;
        background: none;
        text-align: left;
        cursor: pointer;
        font-size: 14px;
        border-bottom: 1px solid #eee;
      }
      #gearMenu button:last-child {
        border-bottom: none;
      }
      #gearMenu button:hover {
        background-color: #f0f0f0;
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
      }
      .modal-content {
        background: white;
        margin: 10% auto;
        padding: 20px;
        width: 300px;
        border-radius: 8px;
        position: relative;
      }
      .modal-content h3 {
        margin-top: 0;
      }
      .modal-content label {
        display: block;
        margin-top: 10px;
      }
      .modal-content input {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      .close {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 20px;
        cursor: pointer;
        user-select: none;
      }
      .btn-save {
        margin-top: 15px;
        padding: 8px;
        background: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
        width: 100%;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <!-- Bánh răng -->
    <div class="gear-icon" id="openSettings">⚙️</div>

    <!-- Popup menu -->
    <div id="gearMenu">
      <button id="openConfig">Nhập thông số</button>
      <button id="logoutBtn">Đăng xuất</button>
    </div>

    <!-- Modal nhập thông số -->
    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <span class="close" id="closeSettings">&times;</span>
        <h3>Nhập thông số</h3>
        <label for="temp">Nhiệt độ (°C):</label>
        <input type="number" id="temp" placeholder="Nhập nhiệt độ" />
        <label for="soilHumidity">Độ ẩm đất (%):</label>
        <input type="number" id="soilHumidity" placeholder="Nhập độ ẩm đất" />
        <label for="airHumidity">Độ ẩm môi trường (%):</label>
        <input
          type="number"
          id="airHumidity"
          placeholder="Nhập độ ẩm môi trường"
        />
        <button class="btn-save" id="saveSettings">Lưu</button>
      </div>
    </div>

    <script src="../static/js/handle_config_page.js"></script>
  </body>
</html>
