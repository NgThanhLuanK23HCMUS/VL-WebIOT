<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

              <a

                aria-current="page"
                href="{{ url_for('home') }}"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('monitor') }}">Monitor</a>
            </li>
            <li class="nav-item">

                >Control Panel</a

        </div>
      </div>
    </nav>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"

    <!-- Biểu đồ 1: Soil Moisture
  {% if data %}
    <div class="d-flex flex-column justify-content-center align-items-center text-white text-center">
      <div class="lead fw-bold">Soil Moisture</div>
      <canvas id="moistureChart" width="200" height="200"></canvas>

      <div class="lead fw-bold">Air Moisture</div>
      <canvas id="moistureChart1" width="200" height="200"></canvas>

      <div class="lead fw-bold">Air Temperature</div>
      <canvas id="temperatureChart" width="200" height="200"></canvas>
    </div> -->
  {% if data %}
  <div class="container mt-5">
    <div class="row justify-content-center text-white text-center">
      <!-- Hàng đầu: 1 biểu đồ ở giữa -->
      <div class="col-12 d-flex justify-content-center mb-4">
        <div>
          <div class="lead fw-bold">Soil Moisture</div>
          <canvas id="moistureChart" width="200" height="200"></canvas>
        </div>
      </div>

      <!-- Hàng dưới: 2 biểu đồ trái - phải -->
      <div class="col-6 d-flex justify-content-end">
        <div>
          <div class="lead fw-bold">Air Moisture</div>
          <canvas id="moistureChart1" width="200" height="200"></canvas>
        </div>
      </div>
      <div class="col-6 d-flex justify-content-start">
        <div>
          <div class="lead fw-bold">Air Temperature</div>
          <canvas id="temperatureChart" width="200" height="200"></canvas>
        </div>
      </div>
    </div>
  </div>
  {% else %}
  <p class="text-danger">Không có dữ liệu để hiển thị.</p>
  {% endif %}

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      // Plugin tô màu trung tâm
      const createCenterBackground = (color = '#2c3e50') => ({
        id: 'centerBackground',
        beforeDraw(chart) {
          const { ctx, chartArea: { left, right, top, bottom } } = chart;
          const centerX = (left + right) / 2;
          const centerY = (top + bottom) / 2;
          const radius = chart._metasets[0].data[0].outerRadius * parseFloat(chart.config.options.cutout) / 100;

          ctx.save();
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.restore();
        }
      });

      // Plugin vẽ text trung tâm
      const createCenterText = (text = '', color = 'white', fontSize = 'bold 24px Arial') => ({
        id: 'centerText',
        afterDraw(chart) {
          const { ctx, chartArea: { left, right, top, bottom } } = chart;
          const centerX = (left + right) / 2;
          const centerY = (top + bottom) / 2;

          ctx.save();
          ctx.font = fontSize;
          ctx.fillStyle = color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, centerX, centerY);
          ctx.restore();
        }
      });

      // Tạo biểu đồ
      function createDoughnutChart(canvasId, dataValue, maxValue, colors) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Value', 'Remaining'],
            datasets: [{
              data: [dataValue, maxValue - dataValue],
              backgroundColor: colors,
              borderWidth: 0
            }]
          },
          options: {
            responsive: false,
            cutout: '80%',
            plugins: {
              legend: { display: false },
              tooltip: { enabled: false }
            }
          },
          plugins: [
            createCenterText(dataValue.toString(), colors[0])
          ]
        });
      }

      const sensorData = JSON.parse('{{ data|tojson|safe }}');
      const soilMoisture = sensorData[0];
      const airTemperature = sensorData[1];
      const airHumidity = sensorData[2];
      createDoughnutChart('moistureChart', soilMoisture, 1024, ['#f5a623', '#2c3e50']); // Soil Moisture
      createDoughnutChart('moistureChart1', airHumidity, 1024, ['#b85c5c', '#2c3e50']);  // Air Moisture
      createDoughnutChart('temperatureChart', airTemperature, 100, ['#00ffff', '#2c3e50']); // Air Temp
    </script>
    {% else %}
    <p class="text-danger">Không có dữ liệu để hiển thị.</p>
{% endif %}



    </div>

        <script src="../static/js/handle_config_page.js"></script>
  </body>
</html>
