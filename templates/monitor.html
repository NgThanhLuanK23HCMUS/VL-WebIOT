    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

    {% if data %}
    <!-- Biểu đồ 1: Soil Moisture -->
    <div class="d-flex flex-column justify-content-center align-items-center text-white text-center">

    <div class="lead fw-bold">Soil Moisture</div>
    <canvas id="moistureChart" width="200" height="200"></canvas>

    <!-- Biểu đồ 2: Air Moisture -->
    <div class="lead fw-bold">Air Moisture</div>
    <canvas id="moistureChart1" width="200" height="200"></canvas>

    <!-- Biểu đồ 3: Air Temperature -->
    <div class="lead fw-bold">Air Temperature</div>
    <canvas id="temperatureChart" width="200" height="200"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      // Plugin tô màu trung tâm
      const createCenterBackground = (color = '#2c3e50') => ({
        id: 'centerBackground',
        beforeDraw(chart) {
          const { ctx, chartArea: { left, right, top, bottom } } = chart;
          const centerX = (left + right) / 2;
          const centerY = (top + bottom) / 2;
          const radius = chart._metasets[0].data[0].outerRadius * parseFloat(chart.config.options.cutout) / 100;

          ctx.save();
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.restore();
        }
      });

      // Plugin vẽ text trung tâm
      const createCenterText = (text = '', color = 'white', fontSize = 'bold 24px Arial') => ({
        id: 'centerText',
        afterDraw(chart) {
          const { ctx, chartArea: { left, right, top, bottom } } = chart;
          const centerX = (left + right) / 2;
          const centerY = (top + bottom) / 2;

          ctx.save();
          ctx.font = fontSize;
          ctx.fillStyle = color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, centerX, centerY);
          ctx.restore();
        }
      });

      // Tạo biểu đồ
      function createDoughnutChart(canvasId, dataValue, maxValue, colors) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Value', 'Remaining'],
            datasets: [{
              data: [dataValue, maxValue - dataValue],
              backgroundColor: colors,
              borderWidth: 0
            }]
          },
          options: {
            responsive: false,
            cutout: '80%',
            plugins: {
              legend: { display: false },
              tooltip: { enabled: false }
            }
          },
          plugins: [
            createCenterBackground(colors[1]),
            createCenterText(dataValue.toString(), colors[0])
          ]
        });
      }

      // Gọi hàm tạo biểu đồ
      createDoughnutChart('moistureChart', data[1], 1024-data[1], ['#f5a623', '#2c3e50']); // Soil Moisture
      createDoughnutChart('moistureChart1', data[2], 1024-data[2], ['#b85c5c', '#2c3e50']);  // Air Moisture
      createDoughnutChart('temperatureChart', data[0], 100-data[0], ['#00ffff', '#2c3e50']); // Air Temp
    </script>
    {% endif %}
  </div>

  </body>
